name: Custom Cline Build

on:
  workflow_dispatch:
    inputs:
      cline_version:
        description: 'Cline version to build (tag or branch)'
        required: true
        default: 'v3.55.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cline Source
        uses: actions/checkout@v4
        with:
          repository: 'cline/cline'
          ref: ${{ github.event.inputs.cline_version }}
          path: 'cline-main'

      - name: Checkout Custom Patch
        uses: actions/checkout@v4
        with:
          path: 'patch-source'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            cline-main/node_modules
            cline-main/webview-ui/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('cline-main/package-lock.json', 'cline-main/webview-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Sync Patch Files
        run: |
          cp -r patch-source/custom-integration cline-main/
          cd cline-main
          # 仅在 patch 逻辑需要时运行
          node custom-integration/scripts/apply-patch.mjs

      - name: Install Dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: |
          cd cline-main
          npm ci --include=optional
          npm install ws @types/ws --save-dev
          cd webview-ui && npm ci --include=optional

      - name: Build and Package
        env:
          CLINE_ENVIRONMENT: production
          NODE_ENV: production
        run: |
          cd cline-main
          # 1. 下载必要的二进制工具
          npm run download-ripgrep
          # 2. 编译 Protobuf 协议
          npm run protos
          # 3. 编译前端 (Webview) - 使用 vite 直接构建，跳过 tsc 检查以防报错
          cd webview-ui && npx vite build
          # 4. 编译后端 (Extension)
          cd ..
          npx esbuild ./src/extension.ts --bundle --outfile=dist/extension.js --external:vscode --format=cjs --platform=node --minify
          # 5. 打包 VSIX
          npx vsce package --no-dependencies --out ../custom-cline.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: custom-cline-${{ github.event.inputs.cline_version }}
          path: custom-cline.vsix