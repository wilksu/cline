name: Build Patched Cline

on:
  workflow_dispatch:
    inputs:
      cline_tag:
        description: 'Cline Version Tag (e.g. v3.57.0 or "latest")'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bridge Repo (Current)
        uses: actions/checkout@v4
        with:
          path: bridge-source

      - name: Resolve Target Cline Tag
        id: resolve-tag
        run: |
          if [ "${{ inputs.cline_tag }}" == "latest" ]; then
            # 使用 GitHub API 获取最新 Release 的 Tag
            LATEST_TAG=$(curl -s https://api.github.com/repos/cline/cline/releases/latest | jq -r .tag_name)
            echo "Resolved latest tag: $LATEST_TAG"
            echo "TARGET_TAG=$LATEST_TAG" >> $GITHUB_ENV
          else
            echo "Using provided tag: ${{ inputs.cline_tag }}"
            echo "TARGET_TAG=${{ inputs.cline_tag }}" >> $GITHUB_ENV
          fi

      - name: Checkout Cline (Official)
        uses: actions/checkout@v4
        with:
          repository: 'cline/cline'
          ref: ${{ env.TARGET_TAG }}
          path: cline-source

      - name: 🧩 Apply Patch and Integrate Bridge
        run: |
          # 1. 创建目标目录并拷贝 bridge 核心代码
          mkdir -p cline-source/src/services/ws-bridge
          cp -r bridge-source/src/services/ws-bridge/* cline-source/src/services/ws-bridge/
          
          # 2. 运行补丁脚本修改 Cline 核心文件
          export CLINE_DIR=$(pwd)/cline-source
          node bridge-source/scripts/apply-patch.mjs
          
      - name: 🏗️ Install and Build VSIX
        working-directory: cline-source
        run: |
          npm install
          npm run install:all
          # 仅在文件名上增加标识，保持 package.json 原始性
          BUILD_DATE=$(date +'%Y%m%d')
          npx vsce package --out ../cline-${{ env.TARGET_TAG }}-wsbridge-${BUILD_DATE}.vsix

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-vsix-bundle
          path: "*.vsix"
          compression-level: 0 # VSIX 已经是压缩格式，禁用二次压缩以提高上传效率
